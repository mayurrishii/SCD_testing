<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud Clipboard</title>
<style>
  :root {
    --bg: #0f1117; --card: #181b25; --border: #2a2f3f;
    --text: #e6e9f0; --muted: #8b93a7; --accent: #4f8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px;
  }
  .card {
    width: 100%; max-width: 640px; background: var(--card);
    border: 1px solid var(--border); border-radius: 14px; padding: 28px;
  }
  h1 { margin: 0 0 4px; font-size: 1.4rem; }
  .sub { color: var(--muted); font-size: .9rem; margin: 0 0 20px; }
  .current {
    border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px;
    white-space: pre-wrap; word-break: break-word; min-height: 60px;
    font-size: .95rem; background: rgba(255,255,255,0.02);
  }
  .empty { color: var(--muted); font-style: italic; }
  .meta { display: flex; justify-content: space-between; align-items: center; margin: 10px 2px 18px; color: var(--muted); font-size: .8rem; }
  button.copy {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: .8rem;
  }
  button.copy:hover { color: var(--text); border-color: var(--muted); }
  textarea {
    width: 100%; min-height: 110px; resize: vertical;
    background: rgba(255,255,255,0.03); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
    font: inherit; font-size: .95rem;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  button.upload {
    background: var(--accent); color: #fff; border: 0; border-radius: 10px;
    padding: 10px 22px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.upload:disabled { opacity: .5; cursor: default; }
  .status { font-size: .85rem; min-height: 1.2em; }
  .ok { color: #4ade80; } .err { color: #f87171; }
</style>
</head>
<body>
  <main class="card">
    <h1>📋 Cloud Clipboard</h1>
    <p class="sub">Shared with everyone — the latest upload wins.</p>

    <div class="current empty" id="current">Clipboard is empty</div>
    <div class="meta">
      <span id="updated"></span>
      <button class="copy" id="copyBtn" hidden>Copy</button>
    </div>

    <textarea id="input" placeholder="Paste or type content here…" maxlength="1000000"></textarea>
    <div class="actions">
      <span class="status" id="status"></span>
      <button class="upload" id="uploadBtn">Upload</button>
    </div>
  </main>

<script>
const $ = (id) => document.getElementById(id);
const currentEl = $("current"), updatedEl = $("updated"), statusEl = $("status");
const inputEl = $("input"), uploadBtn = $("uploadBtn"), copyBtn = $("copyBtn");
let currentText = "";

function render() {
  if (currentText) {
    currentEl.textContent = currentText;
    currentEl.classList.remove("empty");
    copyBtn.hidden = false;
  } else {
    currentEl.textContent = "Clipboard is empty";
    currentEl.classList.add("empty");
    copyBtn.hidden = true;
  }
}

async function load() {
  try {
    const res = await fetch("/api/clipboard");
    const data = await res.json();
    currentText = data.text || "";
    updatedEl.textContent = data.updated_at
      ? "Updated " + new Date(data.updated_at).toLocaleString() : "";
    render();
  } catch (e) {
    statusEl.textContent = "Failed to load clipboard.";
    statusEl.className = "status err";
  }
}

uploadBtn.addEventListener("click", async () => {
  uploadBtn.disabled = true;
  statusEl.textContent = "Uploading…";
  statusEl.className = "status";
  try {
    const res = await fetch("/api/clipboard", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: inputEl.value }),
    });
    if (!res.ok) {
      const detail = (await res.json().catch(() => ({}))).detail;
      throw new Error(typeof detail === "string" ? detail : res.statusText);
    }
    const data = await res.json();
    currentText = data.text || "";
    updatedEl.textContent = "Updated " + new Date(data.updated_at).toLocaleString();
    render();
    statusEl.textContent = "Uploaded ✓";
    statusEl.className = "status ok";
  } catch (e) {
    statusEl.textContent = "Upload failed: " + e.message;
    statusEl.className = "status err";
  } finally {
    uploadBtn.disabled = false;
  }
});

copyBtn.addEventListener("click", async () => {
  await navigator.clipboard.writeText(currentText);
  copyBtn.textContent = "Copied!";
  setTimeout(() => (copyBtn.textContent = "Copy"), 1200);
});

load();
</script>
</body>
</html>
